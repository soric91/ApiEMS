# Topología por defecto: backend en el MISMO host donde corren Mosquitto
# e InfluxDB (p. ej. el gateway IoT). network_mode: host evita el problema
# de que "localhost" dentro del contenedor apunte al contenedor y no al host.
#
# Para correr en máquinas separadas, ver la sección "Docker" del README —
# ahí se documenta el compose alternativo con red bridge + IPs remotas.
#
# Con network_mode: host no hay mapeo de puertos — el contenedor toma el
# puerto del host directamente. Si algo más ya lo tiene, uvicorn no arranca y
# el contenedor entra en bucle de reinicio. Por eso API_PORT es configurable:
# en una máquina donde también corre CRMBackend, el 8000 ya está tomado.

services:
  api:
    build: .
    image: apiems-backend:latest
    container_name: apiems-api
    network_mode: host
    # Sobrescribe el CMD de la imagen, que fija el 8000.
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - ${API_PORT:-8000}
    env_file:
      - .env
    environment:
      # En host networking, MQTT_HOST/INFLUX_URL usan localhost porque el
      # contenedor comparte la pila de red del host directamente.
      MQTT_HOST: ${MQTT_HOST:-localhost}
      INFLUX_URL: ${INFLUX_URL:-http://localhost:8086}
    volumes:
      # data/tariffs.json se edita en caliente vía PUT /api/v1/tariff — sin
      # este volumen, cada `docker compose up --build` lo resetea al valor
      # horneado en la imagen (mismo problema que ya tuvimos con el código).
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      # Lee el mismo puerto que el comando: si no, el healthcheck marcaría
      # unhealthy un contenedor perfectamente sano en otro puerto.
      test:
        - CMD
        - python
        - -c
        - |
          import os, urllib.request
          port = os.environ.get("API_PORT", "8000")
          urllib.request.urlopen(f"http://localhost:{port}/api/v1/health")
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
